<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymelo Studio</title>
<style>
  :root { --bg:#f6f4ef; --ink:#1d1c1a; --accent:#c4552d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --ink:#ecebe7; --accent:#e07a52; }
  }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:center;
         font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1 { font-size:clamp(2.2rem,8vw,4rem); line-height:1.05; margin:0 16px; letter-spacing:-0.02em; text-align:center; }
  h1 span { color:var(--accent); }
</style>
</head>
<body>
  <h1>Polymelo<span>.</span>Studio</h1>
</body>
</html>
